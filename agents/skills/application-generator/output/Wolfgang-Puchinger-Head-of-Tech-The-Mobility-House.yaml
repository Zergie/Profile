subtitle: HEAD OF TECH | PLATFORM STRATEGY & ENGINEERING LEADERSHIP
profile:
  items:
    - Engineering leader and software architect with 18+ years of experience, including more than ten years in technical and people leadership. I combine hands-on platform architecture with delivery accountability, KPI-driven engineering management and stakeholder alignment in regulated environments.
    - My focus is building reliable and maintainable software platforms, developing engineers and translating business goals into clear technical execution.
    - I am motivated to apply this experience to platforms supporting energy-storage commercialisation and the energy transition.
competencies:
  items:
    - heading: Engineering Leadership
      points:
        - More than ten years of technical and organisational leadership, including personnel responsibility for a five-person engineering team and KPI and outcome accountability
        - Coaching and development of engineers; vocational training responsibility for application development
        - Engineering standards, code reviews and structured development processes
    - heading: Platform & System Architecture
      points:
        - Architecture and evolution of complex enterprise applications
        - Modular platform architectures, plugin systems and integration solutions
        - Data modelling and scalable data-structure design
    - heading: Delivery & Stakeholder Alignment
      points:
        - Translation of business and customer requirements into technical priorities, architecture decisions and executable initiatives
        - Alignment of technology priorities across management, customers, development and operational requirements
        - CI/CD delivery with Azure DevOps, Git and automated quality checks
        - Agile product development with Scrum, testing and cross-functional collaboration
