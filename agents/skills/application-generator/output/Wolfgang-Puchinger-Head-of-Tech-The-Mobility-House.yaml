cover_letter:
  recipient:
    - The Mobility House GmbH
    - Vanessa Endres
    - Munich, Germany
  subject: Application for Head of Tech
  salutation: Dear Vanessa
  text:
    - "I see climate change as one of the defining challenges of our generation, and I want my work to contribute to addressing it. The opportunity to shape the technology platform behind the commercialisation of battery energy storage systems therefore strongly appeals to me: it combines my experience in building dependable software platforms with the possibility of supporting a more sustainable energy system. With more than 18 years of software-engineering experience and over ten years in technical and organisational leadership, I bring the hands-on architecture expertise, delivery accountability and stakeholder orientation needed to lead engineering teams in a complex product environment."
    - "As Managing Director and Lead Software Architect at rocom service GmbH, I lead software development, set technical priorities and remain directly involved in the architecture and implementation of business-critical components. Previously, as Head of Software Development, I led a five-person engineering team, coached developers, served as Scrum Master and introduced structured practices including code reviews, test-driven development and continuous delivery."
    - "My experience is rooted in complex and regulated software environments. For the Tau-Office enterprise platform, used by public authorities and social-service organisations, I helped evolve a modular architecture with more than 1,000 modules, numerous external integrations and a bi-temporal data model that enables traceable reconstruction of historical data. In a business-critical integration service, I designed operational monitoring, structured error reporting and automated alerting. I also led the migration from TFS to Azure DevOps and established automated build and release processes, strengthening delivery reliability and engineering quality."
    - "Although my professional background is not directly in BESS, I am accustomed to entering complex domains quickly and translating business and operational requirements into robust technical execution. A personal software project for integrating and analysing trading, transaction and market data has additionally given me practical insight into heterogeneous market interfaces, concurrent processing, retry strategies, rate limits and profit-and-loss reporting."
    - "The Mobility House would gain an engineering leader who can connect Technology, Product, Trading, Operations and Management, turn strategic goals into clear technical priorities and preserve reliability, security and maintainability while teams deliver business value. My leadership approach is based on clear direction, trust and ownership: I remove impediments, support engineers in developing their strengths and create an environment in which technical excellence and commercial outcomes reinforce one another. For me, this role would also provide the opportunity to apply my experience to a purpose I consider genuinely important: helping build the technological foundation for a more sustainable energy future."
