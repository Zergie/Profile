# psmux v3.3.8 baseline configuration.
# These values mirror psmux's built-in defaults while keeping the settings
# managed by this profile repository.

set -g prefix C-b
set bind S set-window-option synchronize-panes

set -g base-index 0
set -g pane-base-index 0
set -g escape-time 500

set -g default-shell "C:/Program Files/PowerShell/7/pwsh.exe"

set -g mouse on
set -g scroll-enter-copy-mode on
set -g mouse-selection on
set -g pwsh-mouse-selection on

set -g mode-keys vi
set -g history-limit 2000
set -g set-clipboard on

set -g cursor-style bar
set -g cursor-blink on
set -g prediction-dimming off
set -g allow-predictions off

# Minimal tmux status
set -g status on
set -g status-interval 15
set -g status-position bottom
set -g status-justify centre
set -g status-style "bg=default,fg=default"
set -g status-left-length 20
set -g status-right-length 20

# Displays “tmux” normally and highlights it while Ctrl-b is active.
set -g status-left "#[bg=default,fg=default,bold]#{?client_prefix,, tmux }#[bg=#698DDA,fg=#000000,bold]#{?client_prefix, tmux ,}#[bg=default,fg=default]"

set -g status-right "#S"

set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=#698DDA]#[bg=#698DDA,fg=#000000] #I:#W #{?window_zoomed_flag,󰊓 ,}#[fg=#698DDA,bg=default]"