# Config files synced by copying instead of linking, because their app replaces the file on
# every save, which breaks a hard link.
#
#   app -> repo: git/hooks/fsmonitor-copy-links, run by git before status, diff, add, commit, ...
#   repo -> app: git/hooks/Update-Links.ps1, run after checkout, merge and rebase
#   guard:       git/hooks/pre-rebase refuses a pull that changes one of these files while a
#                process that writes it is running, since the app would write its old copy back.
#
# Format, tab-separated:
#   <repo path>  <app path relative to the home folder, * allowed>  <writer process paths, ; separated, * allowed>
claude/claude_desktop_config.json	AppData/Local/Claude-Data/claude_*/claude_desktop_config.json	*\WindowsApps\Claude_*\app\claude.exe
codex/config.toml	.codex/config.toml	*\WindowsApps\OpenAI.Codex_*\app\ChatGPT.exe;*\.codex\packages\app-server-daemon\*\codex.exe
